<section class="max-w-[460px] mx-auto my-8 bg-white border border-[#e3e8f1] rounded-[14px] p-7 shadow-sm">
  <p class="text-[#5265d9] text-xs font-bold tracking-[0.12em]">ENTERPRISE OPERATIONS</p>
  
  <h1 class="text-[30px] font-bold my-2.5 text-[#182230]">Create your account</h1>
  
  <p class="text-[#667085] leading-relaxed">New accounts receive the Employee role.</p>

  <form [formGroup]="form" (ngSubmit)="submit()" class="grid gap-2.5 my-6">
    <label for="first-name" class="text-sm font-semibold text-[#182230]">First name</label>
    <input 
      id="first-name" 
      formControlName="first_name" 
      autocomplete="given-name" 
      class="w-full border border-[#d0d5dd] rounded-lg p-3 text-inherit mb-2 focus:outline-2 focus:outline-[#9aa7ff] focus:outline-offset-1"
    />

    <label for="last-name" class="text-sm font-semibold text-[#182230]">Last name</label>
    <input 
      id="last-name" 
      formControlName="last_name" 
      autocomplete="family-name" 
      class="w-full border border-[#d0d5dd] rounded-lg p-3 text-inherit mb-2 focus:outline-2 focus:outline-[#9aa7ff] focus:outline-offset-1"
    />

    <label for="register-email" class="text-sm font-semibold text-[#182230]">Email address</label>
    <input
      id="register-email"
      type="email"
      formControlName="email"
      autocomplete="email"
      class="w-full border border-[#d0d5dd] rounded-lg p-3 text-inherit mb-2 focus:outline-2 focus:outline-[#9aa7ff] focus:outline-offset-1"
    />

    <!-- Password Field with Icon Toggle -->
    <label for="register-password" class="text-sm font-semibold text-[#182230]">Password</label>
    <div class="relative w-full mb-2">
      <input
        id="register-password"
        [type]="showPassword() ? 'text' : 'password'"
        formControlName="password"
        autocomplete="new-password"
        class="w-full border border-[#d0d5dd] rounded-lg p-3 pr-12 text-inherit focus:outline-2 focus:outline-[#9aa7ff] focus:outline-offset-1"
      />
      <button 
        type="button" 
        (click)="togglePasswordVisibility()"
        class="absolute right-3 top-1/2 -translate-y-1/2 text-[#667085] hover:text-[#5265d9] focus:outline-none p-1 cursor-pointer"
      >
        @if (showPassword()) {
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88" />
          </svg>
        } @else {
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
          </svg>
        }
      </button>
    </div>

    <!-- Confirm Password Field with Icon Toggle -->
    <label for="password-confirm" class="text-sm font-semibold text-[#182230]">Confirm password</label>
    <div class="relative w-full mb-2">
      <input
        id="password-confirm"
        [type]="showConfirmPassword() ? 'text' : 'password'"
        formControlName="password_confirm"
        autocomplete="new-password"
        class="w-full border border-[#d0d5dd] rounded-lg p-3 pr-12 text-inherit focus:outline-2 focus:outline-[#9aa7ff] focus:outline-offset-1"
      />
      <button 
        type="button" 
        (click)="toggleConfirmPasswordVisibility()"
        class="absolute right-3 top-1/2 -translate-y-1/2 text-[#667085] hover:text-[#5265d9] focus:outline-none p-1"
      >
        @if (showConfirmPassword()) {
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88" />
          </svg>
        } @else {
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
          </svg>
        }
      </button>
    </div>

    @if (error()) {
      <p class="text-[#b42318] text-sm" role="alert">{{ error() }}</p>
    }

    <button 
      type="submit" 
      [disabled]="loading()"
      class="py-3 px-[18px] border-0 rounded-lg bg-[#4054cf] text-white font-semibold cursor-pointer disabled:opacity-60 disabled:cursor-wait hover:bg-[#3444ab] transition-colors"
    >
      {{ loading() ? 'Creating account...' : 'Create account' }}
    </button>
  </form>

  <p class="text-[#667085] leading-relaxed">
    Already registered?
    <a routerLink="/login" class="text-[#4054cf] hover:underline">Sign in</a>
  </p>
</section>
